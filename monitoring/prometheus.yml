global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: "api-gateway"
    static_configs:
      - targets: ["api-gateway:3001"]
    metrics_path: /metrics

  - job_name: "wallet-monitor"
    static_configs:
      - targets: ["wallet-monitor:4000"]
    metrics_path: /metrics

  - job_name: "tx-parser"
    static_configs:
      - targets: ["tx-parser:4000"]
    metrics_path: /metrics

  - job_name: "copy-engine"
    static_configs:
      - targets: ["copy-engine:4000"]
    metrics_path: /metrics

  - job_name: "execution"
    static_configs:
      - targets: ["execution:4000"]
    metrics_path: /metrics

  - job_name: "analytics"
    static_configs:
      - targets: ["analytics:4000"]
    metrics_path: /metrics

  - job_name: "notification"
    static_configs:
      - targets: ["notification:4000"]
    metrics_path: /metrics
