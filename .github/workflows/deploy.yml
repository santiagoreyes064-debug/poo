name: Deploy

on:
  push:
    branches: [main]
    paths-ignore:
      - "docs/**"
      - "*.md"

jobs:
  build-images:
    name: Build Docker Images
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service:
          - api-gateway
          - wallet-monitor
          - tx-parser
          - copy-engine
          - execution
          - analytics
          - notification
          - frontend
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Uncomment and configure for your container registry:
      # - name: Login to Container Registry
      #   uses: docker/login-action@v3
      #   with:
      #     registry: ${{ vars.REGISTRY_URL }}
      #     username: ${{ secrets.REGISTRY_USERNAME }}
      #     password: ${{ secrets.REGISTRY_PASSWORD }}

      - name: Build image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: apps/${{ matrix.service }}/Dockerfile
          push: false
          tags: solana-copy-trading/${{ matrix.service }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Uncomment to push images to your registry:
      # - name: Push image
      #   uses: docker/build-push-action@v5
      #   with:
      #     context: .
      #     file: apps/${{ matrix.service }}/Dockerfile
      #     push: true
      #     tags: |
      #       ${{ vars.REGISTRY_URL }}/solana-copy-trading/${{ matrix.service }}:${{ github.sha }}
      #       ${{ vars.REGISTRY_URL }}/solana-copy-trading/${{ matrix.service }}:latest

